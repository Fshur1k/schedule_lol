# Rift Slate — автоматична збірка виконуваних файлів для Windows і Mac.
#
# Навіщо це потрібно: PyInstaller не вміє "крос-компілювати" — .exe для
# Windows можна зібрати тільки на Windows, а версію для Mac — тільки на
# Mac. Якщо в тебе тільки один із цих комп'ютерів, GitHub Actions вирішує
# проблему: він сам піднімає в хмарі і Windows-, і Mac-машину, збирає на
# кожній свою версію, і віддає готові файли — тобі не треба володіти
# обома ОС.
#
# Як користуватись:
#   1. Заведи (або вже маєш) репозиторій на GitHub із цими файлами:
#      parser.py, run_app.py, rift-slate.html, requirements.txt,
#      і цей файл за шляхом .github/workflows/build.yml
#   2. Запусти збірку одним із двох способів:
#        a) На вкладці "Actions" репозиторію -> цей workflow -> "Run workflow"
#        b) Або запуштай git tag на кшталт v1.0 (тоді збірка стартує сама)
#   3. Через кілька хвилин у розділі "Actions" -> конкретний запуск ->
#      "Artifacts" з'являться два файли для скачування:
#        RiftSlateUpdater-windows.exe
#        RiftSlateUpdater-mac
#      Їх можна давати будь-кому — Python їм для запуску не потрібен.

name: Build Rift Slate executables

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            add_data_sep: ";"
            raw_name: RiftSlateUpdater.exe
            artifact_name: RiftSlateUpdater-windows.exe
          - os: macos-latest
            add_data_sep: ":"
            raw_name: RiftSlateUpdater
            artifact_name: RiftSlateUpdater-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Зібрати виконуваний файл
        shell: bash
        run: |
          pyinstaller --onefile --name RiftSlateUpdater \
            --add-data "rift-slate.html${{ matrix.add_data_sep }}." \
            run_app.py

      - name: Перейменувати артефакт (щоб не плутати Windows/Mac при скачуванні)
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.raw_name }}" "out/${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/${{ matrix.artifact_name }}
